# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fraud_monitor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:HueeHuee}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — FIX 10: allow extra startup time for Docker MySQL to become ready
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA Configuration
# Development: auto-updates schema. Switch to 'validate' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# FIX 8: suppress the JPA open-in-view startup warning
spring.jpa.open-in-view=false

# JWT Configuration
# FIX 11: Secret is used as raw bytes. Ensure JWT_SECRET env var is at least 32 characters.
jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3VyZUZyYXVkRGV0ZWN0aW9uSldUU2VjcmV0S2V5Rm9yUHJvZHVjdGlvbjIwMjQ=}
jwt.expiration=${JWT_EXPIRY:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRY:604800000}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# FIX 8: prevent mail auto-config from hanging the app when SMTP is unreachable locally
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# CORS Configuration — FIX 15: default to Vite's port 5173 (not 3000)
cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# Rate Limiting
rate.limit.max.attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}

# Logging (override in application-prod.properties for production)
logging.level.com.frauddetector=INFO
logging.level.org.springframework.security=WARN

# Server
server.port=8080