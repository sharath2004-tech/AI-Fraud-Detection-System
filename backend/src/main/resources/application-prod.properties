# ============================================================
# Production Profile — application-prod.properties
# Activate with: --spring.profiles.active=prod
# or: SPRING_PROFILES_ACTIVE=prod in environment variables
# ============================================================

# JPA — validate schema only, never modify it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging — reduce noise, only warn-level and above
logging.level.com.frauddetector=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# Connection pool tuning for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Disable Spring Boot's default banner in logs
spring.main.banner-mode=off

# Actuator — restrict to health check only in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
